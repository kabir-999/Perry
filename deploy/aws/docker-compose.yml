services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web_fuzzer}
      POSTGRES_USER: ${POSTGRES_USER:-web_fuzzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-web_fuzzer} -d ${POSTGRES_DB:-web_fuzzer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-web_fuzzer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-web_fuzzer}
      JWT_SECRET: ${JWT_SECRET}
      LOG_ENCRYPTION_KEY: ${LOG_ENCRYPTION_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
